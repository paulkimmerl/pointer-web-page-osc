```html
<script>
const dot = document.getElementById("dot");
const info = document.getElementById("info");

let drawing = false;
let lastX = 0;
let lastY = 0;

document.body.style.touchAction = "none";

document.addEventListener("pointerdown", event => {
    drawing = true;

    lastX = event.clientX;
    lastY = event.clientY;

    dot.style.background = "#00ffaa";
    dot.style.left = lastX + "px";
    dot.style.top = lastY + "px";

    // Neuen Strich beginnen
    console.log("START", lastX, lastY);
});

document.addEventListener("pointermove", event => {
    if (!drawing) return;

    const x = event.clientX;
    const y = event.clientY;

    dot.style.left = x + "px";
    dot.style.top = y + "px";

    info.textContent = `X: ${Math.round(x)} | Y: ${Math.round(y)}`;

    // Jede Position während des Haltens
    console.log("MOVE", x, y);

    lastX = x;
    lastY = y;
});

function stopDrawing() {
    if (!drawing) return;

    drawing = false;
    dot.style.background = "#ff0055";

    // Strich beenden
    console.log("END");
}

document.addEventListener("pointerup", stopDrawing);
document.addEventListener("pointercancel", stopDrawing);
</script>
```
