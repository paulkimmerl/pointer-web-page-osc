<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pointer Test</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  color: white;
  font-family: sans-serif;
  touch-action: none;
}
#info {
  position: absolute;
  top: 20px;
  left: 20px;
  pointer-events: none;
}
#dot {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ff0055;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="info">Finger gedrückt halten und bewegen</div>
<div id="dot"></div>
<script>
const dot = document.getElementById("dot");
const info = document.getElementById("info");
let drawing = false;

document.addEventListener("pointerdown", e => {
  drawing = true;
  dot.style.background = "#00ffaa";
  move(e);
});

document.addEventListener("pointermove", e => {
  if (drawing) move(e);
});

function move(e) {
  dot.style.left = e.clientX + "px";
  dot.style.top = e.clientY + "px";
  info.textContent = `X: ${Math.round(e.clientX)} | Y: ${Math.round(e.clientY)}`;
  console.log("MOVE", e.clientX, e.clientY);
}

function stop() {
  drawing = false;
  dot.style.background = "#ff0055";
}

document.addEventListener("pointerup", stop);
document.addEventListener("pointercancel", stop);
</script>
</body>
</html>
