<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  touch-action: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#info {
  position: fixed;
  top: 15px;
  left: 15px;
  color: white;
  font: 16px sans-serif;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="info">Finger gedrückt halten und bewegen</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}

resize();
window.addEventListener("resize", resize);

let drawing = false;

canvas.addEventListener("pointerdown", e => {
  // Alten Strich löschen, wenn ein neuer Touch beginnt
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawing = true;
  canvas.setPointerCapture(e.pointerId);

  ctx.beginPath();
  ctx.moveTo(e.clientX, e.clientY);

  ctx.strokeStyle = "#ff0055";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.lineTo(e.clientX + 0.1, e.clientY + 0.1);
  ctx.stroke();

  info.textContent = "Drawing";
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;

  ctx.lineTo(e.clientX, e.clientY);
  ctx.stroke();

  info.textContent =
    "X: " + Math.round(e.clientX) +
    " | Y: " + Math.round(e.clientY);
});

function stopDrawing() {
  drawing = false;
  info.textContent = "Finger loslassen = Pause";
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
</script>

</body>
</html>
